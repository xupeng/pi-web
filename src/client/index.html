<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PI WEB</title>
    <meta name="theme-color" content="#0d1117" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <style>
      @font-face {
        font-family: "Oxanium";
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url("%BASE_URL%fonts/oxanium-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Oxanium";
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url("%BASE_URL%fonts/oxanium-latin-ext.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Cascadia Code";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("%BASE_URL%fonts/cascadia-code-latin-400-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Cascadia Code";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("%BASE_URL%fonts/cascadia-code-latin-500-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Cascadia Code";
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("%BASE_URL%fonts/cascadia-code-latin-600-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Cascadia Code";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("%BASE_URL%fonts/cascadia-code-latin-700-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      :root {
        color-scheme: dark;
        --pi-control-font-size: 16px;
        --pi-control-font-family: "Oxanium", system-ui, sans-serif;
        --pi-control-monospace-font-family: "Cascadia Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --pi-bg: #0d1117;
        --pi-surface: #161b22;
        --pi-surface-hover: #21262d;
        --pi-terminal-bg: #05070a;
        --pi-terminal-text: #e6edf3;
        --pi-border: #30363d;
        --pi-border-muted: #21262d;
        --pi-text: #e6edf3;
        --pi-text-secondary: #c9d1d9;
        --pi-text-bright: #f0f6fc;
        --pi-muted: #8b949e;
        --pi-dim: #6e7681;
        --pi-accent: #58a6ff;
        --pi-accent-border: #2f81f7;
        --pi-selection-bg: #0d2847;
        --pi-success: #3fb950;
        --pi-success-border: #238636;
        --pi-success-bg: #0f1b12;
        --pi-success-surface: #0f2a16;
        --pi-success-ring: #3fb95055;
        --pi-warning: #d29922;
        --pi-warning-border: #6e5200;
        --pi-warning-surface: #1f1a10;
        --pi-danger: #ff7b72;
        --pi-purple: #d2a8ff;
        --pi-purple-border: #a371f7;
        --pi-purple-surface: #21132f;
        --pi-overlay: #0008;
        --pi-shadow-soft: #0006;
        --pi-shadow: #0008;
        --pi-shadow-strong: #000b;
        --pi-bg-overlay-soft: #0d1117dd;
        --pi-bg-overlay: #0d1117e6;
        --pi-success-bg-overlay: #0f1b12ee;
        --pi-terminal-selection: #264f78;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--pi-bg); color: var(--pi-text); }
      body { min-height: 100dvh; }
      /* Set by configureIosSafeAreaViewport() for iOS standalone PWAs, where
         WebKit's env(safe-area-inset-*) is unreliable (bugs 313800/317153):
         the app drops viewport-fit=cover and pads the bottom with a fixed
         fallback instead. */
      body.ios-pwa-no-cover { --pi-ios-safe-area-bottom: 34px; }
    </style>
  </head>
  <body>
    <pi-web-app></pi-web-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
